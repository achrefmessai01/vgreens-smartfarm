# Fly.io configuration for vGreens Smart Farm Backend — Production
app = "vgreens-backend"
primary_region = "fra"

[build]
  dockerfile = "docker/Dockerfile"

# Run pending TypeORM migrations in a one-off machine BEFORE swapping in the
# new app version. Fly aborts the deploy if this exits non-zero, so a broken
# migration never lands in production. Secrets (DATABASE_*) are inherited
# from the app's secret store — no duplication into GitLab CI variables.
[deploy]
  release_command = "node ./node_modules/typeorm/cli.js -d dist/config/data-source.js migration:run"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"

[vm]
  memory = "4gb"
  cpu_kind = "performance"
  cpus = 2

[env]
  PORT = "8080"
  NODE_ENV = "production"
  HOSTNAME = "0.0.0.0"

# Secrets managed via flyctl (set once):
# flyctl secrets set \
#   DATABASE_HOST=... DATABASE_PORT=... DATABASE_NAME=... \
#   DATABASE_USER=... DATABASE_PASSWORD=... \
#   CLERK_SECRET_KEY=... CLERK_WEBHOOK_SECRET=... \
#   INFLUXDB_URL=... INFLUXDB_TOKEN=... INFLUXDB_ORG=... INFLUXDB_BUCKET=... \
#   FRONTEND_APP_URL=... FRONTEND_PROD_APP_URL=... \
#   --app vgreens-backend

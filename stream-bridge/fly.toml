# Fly.io configuration for the vGreens stream bridge.
# Public surface: SSH only (external 22 -> sshd on 2222).
# The reverse-tunneled stream port 8090 is intentionally NOT declared here,
# so it is reachable only inside the Fly private network at
# vgreens-stream-bridge.internal:8090.
app = "vgreens-stream-bridge"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 2222
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 22

[vm]
  size = "shared-cpu-1x"
  memory = "256mb"

# Secrets (set once):
#   fly secrets set TUNNEL_AUTHORIZED_KEYS="$(cat sv01_stream_bridge.pub)" -a vgreens-stream-bridge
#   fly secrets set SSH_HOST_ED25519_KEY="$(cat bridge_host_ed25519)" -a vgreens-stream-bridge

<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#016f7c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0dea97;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#grad1)"/>
  <g transform="translate(400, 300)">
    <!-- Sun -->
    <circle cx="0" cy="-150" r="40" fill="#FFD700" opacity="0.9"/>
    <!-- Farm building -->
    <rect x="-80" y="0" width="160" height="120" fill="#8B4513" opacity="0.8"/>
    <polygon points="-80,0 0,-40 80,0" fill="#654321" opacity="0.8"/>
    <rect x="-60" y="20" width="30" height="40" fill="#87CEEB" opacity="0.7"/>
    <rect x="30" y="20" width="30" height="40" fill="#87CEEB" opacity="0.7"/>
    <!-- Fields -->
    <rect x="-200" y="120" width="120" height="80" fill="#228B22" opacity="0.6"/>
    <rect x="-60" y="120" width="120" height="80" fill="#32CD32" opacity="0.6"/>
    <rect x="80" y="120" width="120" height="80" fill="#228B22" opacity="0.6"/>
    <!-- Plants -->
    <circle cx="-140" cy="100" r="8" fill="#2F4F2F"/>
    <circle cx="-120" cy="100" r="8" fill="#2F4F2F"/>
    <circle cx="-100" cy="100" r="8" fill="#2F4F2F"/>
    <circle cx="20" cy="100" r="8" fill="#2F4F2F"/>
    <circle cx="40" cy="100" r="8" fill="#2F4F2F"/>
    <circle cx="60" cy="100" r="8" fill="#2F4F2F"/>
    <circle cx="140" cy="100" r="8" fill="#2F4F2F"/>
    <circle cx="160" cy="100" r="8" fill="#2F4F2F"/>
    <circle cx="180" cy="100" r="8" fill="#2F4F2F"/>
  </g>
  <!-- Text -->
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">VGreens Smart Farm</text>
</svg>


<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - vGreens Lab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #111827;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container {
      max-width: 28rem;
      width: 100%;
      text-align: center;
    }
    .icon-container {
      width: 5rem;
      height: 5rem;
      margin: 0 auto 2rem;
      background-color: rgba(234, 88, 12, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon {
      width: 2.5rem;
      height: 2.5rem;
      stroke: #fb923c;
      stroke-width: 2;
      fill: none;
    }
    h1 {
      font-size: 1.875rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .description {
      font-size: 1.125rem;
      color: #d1d5db;
      margin-bottom: 0.75rem;
    }
    .hint {
      font-size: 0.875rem;
      color: #9ca3af;
      margin-bottom: 2rem;
    }
    .reload-btn {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: #ea580c;
      color: white;
      border: none;
      border-radius: 0.375rem;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s;
    }
    .reload-btn:hover {
      background-color: #c2410c;
    }
    .footer {
      margin-top: 2rem;
      padding-top: 1rem;
      font-size: 0.75rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
        <path d="M5 13a10 10 0 0 1 5.24-2.76"></path>
        <circle cx="12" cy="20" r="1"></circle>
      </svg>
    </div>
    
    <h1>No Internet Connection</h1>
    <p class="description">Please check your connection and try again.</p>
    <p class="hint">Connect to Wi-Fi or mobile data to continue using vGreens Lab.</p>
    
    <button class="reload-btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"></path>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
        <path d="M3 22v-6h6"></path>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
      </svg>
      Reload Page
    </button>
    
    <div class="footer">
      <p>Make sure you're connected to the internet</p>
    </div>
  </div>
</body>
</html>

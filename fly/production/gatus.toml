# Fly.io configuration for vGreens Status Page (Gatus) — Production
# Deploy: flyctl deploy gatus --remote-only --config fly/production/gatus.toml
app = "vgreens-status"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "gatus_data"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  GATUS_CONFIG_PATH = "/config/config.yaml"

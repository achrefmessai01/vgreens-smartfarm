# Fly.io configuration for vGreens Smart Farm Backend — Production
# Deploy: flyctl deploy backend --remote-only --config fly/production/backend.toml
app = "vgreens-backend"
primary_region = "fra"

[build]
  dockerfile = "docker/Dockerfile"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"

[vm]
  memory = "4gb"
  cpu_kind = "performance"
  cpus = 2

[env]
  PORT = "8080"
  NODE_ENV = "production"
  HOSTNAME = "0.0.0.0"

# Secrets managed via flyctl (set once, not in CI):
# flyctl secrets set \
#   DATABASE_HOST=... DATABASE_PORT=... DATABASE_NAME=... \
#   DATABASE_USER=... DATABASE_PASSWORD=... \
#   CLERK_SECRET_KEY=... CLERK_WEBHOOK_SECRET=... \
#   INFLUXDB_URL=... INFLUXDB_TOKEN=... INFLUXDB_ORG=... INFLUXDB_BUCKET=... \
#   FRONTEND_APP_URL=... FRONTEND_PROD_APP_URL=... \
#   --app vgreens-backend

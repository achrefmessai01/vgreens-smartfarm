image: alpine:latest

stages:
  - deploy

variables:
  GIT_STRATEGY: fetch
  FLY_VERSION: '0.3.55'

# Deploy Backend to Fly.io
deploy_backend:
  stage: deploy
  only:
    - master
  before_script:
    - apk add --no-cache curl
    - curl -L https://fly.io/install.sh | sh
    - export FLYCTL_INSTALL="/root/.fly"
    - export PATH="$FLYCTL_INSTALL/bin:$PATH"
    - echo "=== DEBUG - Environment Check ==="
    - echo "Checking for FLY_API_TOKEN..."
    - env | grep -i fly || echo "No FLY variables found"
    - echo "=== Checking Token ==="
    - test -n "$FLY_API_TOKEN" && echo "Token is set (length ${#FLY_API_TOKEN})" || (echo "ERROR - Token not set" && exit 1)
    - echo "Testing authentication..."
    - flyctl auth whoami || echo "Auth failed"
  script:
    - cd backend
    - echo "=== Starting Backend Deployment ==="
    - flyctl deploy --remote-only --config fly.toml
  environment:
    name: production/backend
    url: https://vgreens-backend.fly.dev

# Deploy Frontend to Fly.io
deploy_frontend:
  stage: deploy
  only:
    - master
  before_script:
    - apk add --no-cache curl
    - curl -L https://fly.io/install.sh | sh
    - export FLYCTL_INSTALL="/root/.fly"
    - export PATH="$FLYCTL_INSTALL/bin:$PATH"
    - echo "=== Frontend Token Check ==="
    - test -n "$FLY_API_TOKEN" && echo "Token OK" || (echo "ERROR - Token not set" && exit 1)
    - flyctl auth whoami || echo "Auth failed"
  script:
    - cd frontend
    - echo "=== Starting Frontend Deployment ==="
    - flyctl deploy --remote-only --config fly.toml
  environment:
    name: production/frontend
    url: https://vgreens-frontend.fly.dev
  needs:
    - deploy_backend

# Manual deployment
deploy_manual:
  stage: deploy
  when: manual
  before_script:
    - apk add --no-cache curl
    - curl -L https://fly.io/install.sh | sh
    - export FLYCTL_INSTALL="/root/.fly"
    - export PATH="$FLYCTL_INSTALL/bin:$PATH"
    - test -n "$FLY_API_TOKEN" && echo "Token OK" || (echo "ERROR - Token not set" && exit 1)
  script:
    - echo "=== Deploying Backend ==="
    - cd backend && flyctl deploy --remote-only --config fly.toml
    - echo "=== Deploying Frontend ==="
    - cd ../frontend && flyctl deploy --remote-only --config fly.toml

image: alpine:latest

stages:
  - deploy

variables:
  GIT_STRATEGY: fetch
  # Fly.io CLI version
  FLY_VERSION: '0.3.55'

.install_flyctl: &install_flyctl
  - apk add --no-cache curl
  - curl -L https://fly.io/install.sh | sh
  - export FLYCTL_INSTALL="/root/.fly"
  - export PATH="$FLYCTL_INSTALL/bin:$PATH"

# Deploy Backend to Fly.io
deploy_backend:
  stage: deploy
  only:
    - master
  before_script:
    - *install_flyctl
    # Verify token is set
    - |
      if [ -z "$FLY_API_TOKEN" ]; then
        echo "ERROR: FLY_API_TOKEN is not set in GitLab CI/CD variables"
        echo "Please add it in Settings → CI/CD → Variables"
        exit 1
      fi
    - echo "✓ FLY_API_TOKEN is set (length: ${#FLY_API_TOKEN})"
  script:
    - cd backend
    - flyctl deploy --remote-only --config fly.toml
  environment:
    name: production/backend
    url: https://vgreens-backend.fly.dev

# Deploy Frontend to Fly.io
deploy_frontend:
  stage: deploy
  only:
    - master
  before_script:
    - *install_flyctl
    - |
      if [ -z "$FLY_API_TOKEN" ]; then
        echo "ERROR: FLY_API_TOKEN is not set in GitLab CI/CD variables"
        exit 1
      fi
  script:
    - cd frontend
    - flyctl deploy --remote-only --config fly.toml
  environment:
    name: production/frontend
    url: https://vgreens-frontend.fly.dev
  needs:
    - deploy_backend

# Manual deployment job for staging/testing
deploy_manual:
  stage: deploy
  when: manual
  before_script:
    - *install_flyctl
    - |
      if [ -z "$FLY_API_TOKEN" ]; then
        echo "ERROR: FLY_API_TOKEN is not set in GitLab CI/CD variables"
        exit 1
      fi
  script:
    - echo "Deploying backend..."
    - cd backend && flyctl deploy --remote-only --config fly.toml
    - echo "Deploying frontend..."
    - cd ../frontend && flyctl deploy --remote-only --config fly.toml

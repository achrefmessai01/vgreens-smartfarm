image: alpine:latest

stages:
  - deploy

variables:
  GIT_STRATEGY: fetch
  FLY_VERSION: '0.3.55'

.flyctl_setup: &flyctl_setup
  - apk add --no-cache curl
  - curl -L https://fly.io/install.sh | sh
  - export FLYCTL_INSTALL="/root/.fly"
  - export PATH="$FLYCTL_INSTALL/bin:$PATH"
  - test -n "$FLY_API_TOKEN" && echo "Token OK" || (echo "ERROR - Token not set" && exit 1)
  - flyctl auth whoami || echo "Auth failed"

# ──────────────────────────────────────
# Production — triggered on master
# ──────────────────────────────────────

deploy_backend:
  stage: deploy
  only:
    - master
  before_script:
    - *flyctl_setup
  script:
    - cd backend
    - echo "=== Starting Production Backend Deployment ==="
    - |
      MAX_RETRIES=3
      RETRY_COUNT=0
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        echo "Deployment attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
        if flyctl deploy --remote-only --no-cache --config fly.production.toml; then
          echo "Deployment successful!"
          exit 0
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "Deployment failed, waiting 30 seconds before retry..."
            sleep 30
          else
            echo "All deployment attempts failed"
            exit 1
          fi
        fi
      done
  environment:
    name: production/backend
    url: https://vgreens-backend.fly.dev

deploy_frontend:
  stage: deploy
  only:
    - master
  before_script:
    - *flyctl_setup
  script:
    - cd frontend
    - echo "=== Starting Production Frontend Deployment ==="
    - test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" && echo "Clerk publishable key present" || (echo "ERROR - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY not set" && exit 1)
    - test -n "$CLERK_SECRET_KEY" && echo "Clerk secret key present" || (echo "ERROR - CLERK_SECRET_KEY not set" && exit 1)
    - test -n "$NEXT_PUBLIC_POSTHOG_KEY" && echo "PostHog key present" || (echo "ERROR - NEXT_PUBLIC_POSTHOG_KEY not set" && exit 1)
    - flyctl secrets set CLERK_SECRET_KEY="$CLERK_SECRET_KEY" --app vgreens-frontend
    - |
      MAX_RETRIES=3
      RETRY_COUNT=0
      BUILD_ARGS="--build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY --build-arg NEXT_PUBLIC_POSTHOG_KEY=$NEXT_PUBLIC_POSTHOG_KEY --build-arg NEXT_PUBLIC_POSTHOG_HOST=$NEXT_PUBLIC_POSTHOG_HOST"
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        echo "Deployment attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
        if flyctl deploy --remote-only --no-cache --config fly.production.toml $BUILD_ARGS; then
          echo "Deployment successful!"
          exit 0
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "Deployment failed, waiting 30 seconds before retry..."
            sleep 30
          else
            echo "All deployment attempts failed"
            exit 1
          fi
        fi
      done
  environment:
    name: production/frontend
    url: https://vgreens-frontend.fly.dev
  needs:
    - deploy_backend

deploy_status:
  stage: deploy
  only:
    - master
  before_script:
    - *flyctl_setup
  script:
    - cd gatus
    - echo "=== Starting Production Status Page Deployment ==="
    - |
      MAX_RETRIES=3
      RETRY_COUNT=0
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        echo "Deployment attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
        if flyctl deploy --remote-only --no-cache --config fly.production.toml; then
          echo "Deployment successful!"
          exit 0
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "Deployment failed, waiting 30 seconds before retry..."
            sleep 30
          else
            echo "All deployment attempts failed"
            exit 1
          fi
        fi
      done
  environment:
    name: production/status
    url: https://vgreens-status.fly.dev

# Manual production deployment
deploy_manual:
  stage: deploy
  when: manual
  before_script:
    - *flyctl_setup
  script:
    - echo "=== Deploying Backend (Production) ==="
    - cd backend && flyctl deploy --remote-only --no-cache --config fly.production.toml
    - echo "=== Deploying Frontend (Production) ==="
    - cd ../frontend && flyctl deploy --remote-only --no-cache --config fly.production.toml
    - echo "=== Deploying Status Page (Production) ==="
    - cd ../gatus && flyctl deploy --remote-only --no-cache --config fly.production.toml

# ──────────────────────────────────────

image: alpine:latest

stages:
  - deploy

variables:
  GIT_STRATEGY: fetch
  # Fly.io CLI version
  FLY_VERSION: '0.3.55'

.install_flyctl: &install_flyctl
  - apk add --no-cache curl
  - curl -L https://fly.io/install.sh | sh
  - export FLYCTL_INSTALL="/root/.fly"
  - export PATH="$FLYCTL_INSTALL/bin:$PATH"

# Deploy Backend to Fly.io
deploy_backend:
  stage: deploy
  only:
    - master
  before_script:
    - *install_flyctl
    - echo "=== DEBUG - Environment Check ==="
    - echo "Checking for FLY_API_TOKEN..."
    - 'env | grep -i fly || echo "No FLY variables found in environment"'
    - echo ""
    - echo "=== Checking FLY_API_TOKEN Variable ==="
    - |
      if [ -z "$FLY_API_TOKEN" ]; then
        echo "ERROR: FLY_API_TOKEN is NOT set"
        echo "Please add FLY_API_TOKEN in GitLab: Settings -> CI/CD -> Variables"
        echo "Create token with: flyctl tokens create deploy"
        exit 1
      fi
    - echo "FLY_API_TOKEN is set"
    - echo "Token length: ${#FLY_API_TOKEN} characters"
    - 'echo "First 10 chars: ${FLY_API_TOKEN:0:10}..."'
    - 'echo "Last 10 chars: ...${FLY_API_TOKEN: -10}"'
    - echo ""
    - echo "=== Testing Fly.io Authentication ==="
    - 'flyctl auth whoami || echo "Authentication failed - token may be invalid"'
    - echo ""
  script:
    - cd backend
    - echo "=== Starting Backend Deployment ==="
    - flyctl deploy --remote-only --config fly.toml
  environment:
    name: production/backend
    url: https://vgreens-backend.fly.dev

# Deploy Frontend to Fly.io
deploy_frontend:
  stage: deploy
  only:
    - master
  before_script:
    - *install_flyctl
    - echo "=== Frontend Deployment - Token Check ==="
    - |
      if [ -z "$FLY_API_TOKEN" ]; then
        echo "ERROR: FLY_API_TOKEN is NOT set"
        exit 1
      fi
    - echo "FLY_API_TOKEN is set (length: ${#FLY_API_TOKEN})"
    - 'flyctl auth whoami || echo "Authentication failed"'
  script:
    - cd frontend
    - echo "=== Starting Frontend Deployment ==="
    - flyctl deploy --remote-only --config fly.toml
  environment:
    name: production/frontend
    url: https://vgreens-frontend.fly.dev
  needs:
    - deploy_backend

# Manual deployment job for staging/testing
deploy_manual:
  stage: deploy
  when: manual
  before_script:
    - *install_flyctl
    - echo "=== Manual Deployment - Token Check ==="
    - |
      if [ -z "$FLY_API_TOKEN" ]; then
        echo "ERROR: FLY_API_TOKEN is NOT set"
        exit 1
      fi
    - echo "FLY_API_TOKEN is set"
  script:
    - echo "=== Deploying Backend ==="
    - cd backend && flyctl deploy --remote-only --config fly.toml
    - echo "=== Deploying Frontend ==="
    - cd ../frontend && flyctl deploy --remote-only --config fly.toml

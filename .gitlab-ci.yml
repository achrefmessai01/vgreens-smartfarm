image: alpine:latest

stages:
  - migrate_check    # Show pending migrations against the target DB
  - migrate_apply    # Apply them (manual on production)
  - deploy           # Roll out the new code
  - migrate_rollback # Manual emergency-revert lever

variables:
  GIT_STRATEGY: fetch
  FLY_VERSION: '0.3.55'
  NODE_VERSION: '20'

.flyctl_setup: &flyctl_setup
  - apk add --no-cache curl
  - curl -L https://fly.io/install.sh | sh
  - export FLYCTL_INSTALL="/root/.fly"
  - export PATH="$FLYCTL_INSTALL/bin:$PATH"
  - test -n "$FLY_API_TOKEN" && echo "Token OK" || (echo "ERROR - Token not set" && exit 1)
  - flyctl auth whoami || echo "Auth failed"

# ──────────────────────────────────────
# Migration jobs
# ──────────────────────────────────────
#
# Strategy:
#   1. `migrate_show_*`  — auto, prints the list of pending migrations. Pure
#       visibility, never fails the pipeline.
#   2. `migrate_run_*`   — applies migrations from the CI container against the
#       target DB. Staging is automatic; production is `when: manual` so a
#       human has to click "play" after reading the show output.
#   3. `deploy_*`        — needs the run job, so the deploy can't start until
#       migrations are applied.
#   4. `migrate_revert_*` — manual emergency rollback, runs against the live
#       Fly machine.
#
# Defense-in-depth: `release_command` in fly.{production,staging}.toml ALSO
# runs `migration:run` during deploy. If somehow a migration leaks through
# without the CI job applying it, Fly catches it. `migration:run` is
# idempotent — already-applied migrations are skipped.
#
# REQUIRED CI/CD VARIABLES (Settings → CI/CD → Variables):
#   For environment scope `staging/backend`:
#     DATABASE_HOST, DATABASE_PORT, DATABASE_NAME, DATABASE_USER,
#     DATABASE_PASSWORD, DATABASE_SSL  (set to "true" for Supabase)
#   For environment scope `production/backend`:
#     Same five vars + DATABASE_SSL=true
#   Mark all as Protected (only protected branches) and Masked
#   (DATABASE_PASSWORD especially — keeps it out of logs).

.node_image: &node_image
  image: node:20-alpine

.migrate_install: &migrate_install
  - cd backend
  - apk add --no-cache git
  - npm ci --no-audit --no-fund
  - npm run build

migrate_show_staging:
  <<: *node_image
  stage: migrate_check
  only:
    - staging
  before_script:
    - *migrate_install
  script:
    - echo "=== Pending migrations on STAGING DB ==="
    - npm run migration:show:prod
  environment:
    name: staging/backend
    action: prepare
  allow_failure: false

migrate_show_production:
  <<: *node_image
  stage: migrate_check
  only:
    - master
  before_script:
    - *migrate_install
  script:
    - echo "=== Pending migrations on PRODUCTION DB ==="
    - npm run migration:show:prod
  environment:
    name: production/backend
    action: prepare
  allow_failure: false

migrate_run_staging:
  <<: *node_image
  stage: migrate_apply
  only:
    - staging
  needs:
    - migrate_show_staging
  before_script:
    - *migrate_install
  script:
    - echo "=== Applying migrations on STAGING DB ==="
    - npm run migration:run:prod
    - echo "=== Post-apply state ==="
    - npm run migration:show:prod
  environment:
    name: staging/backend
    action: prepare

migrate_run_production:
  <<: *node_image
  stage: migrate_apply
  when: manual            # Production requires explicit human click.
  only:
    - master
  needs:
    - migrate_show_production
  before_script:
    - *migrate_install
  script:
    - echo "=== Applying migrations on PRODUCTION DB ==="
    - npm run migration:run:prod
    - echo "=== Post-apply state ==="
    - npm run migration:show:prod
  environment:
    name: production/backend
    action: prepare

migrate_revert_staging:
  <<: *node_image
  stage: migrate_rollback
  when: manual
  only:
    - staging
  before_script:
    - *migrate_install
  script:
    - echo "=== Reverting last migration on STAGING DB ==="
    - npm run migration:revert:prod
    - npm run migration:show:prod
  environment:
    name: staging/backend
    action: prepare

migrate_revert_production:
  <<: *node_image
  stage: migrate_rollback
  when: manual
  only:
    - master
  before_script:
    - *migrate_install
  script:
    - echo "=== Reverting last migration on PRODUCTION DB ==="
    - npm run migration:revert:prod
    - npm run migration:show:prod
  environment:
    name: production/backend
    action: prepare

# ──────────────────────────────────────
# Production — triggered on master
# ──────────────────────────────────────

deploy_backend:
  stage: deploy
  only:
    - master
  needs:
    - migrate_run_production
  before_script:
    - *flyctl_setup
  script:
    - cd backend
    - echo "=== Starting Production Backend Deployment ==="
    # Migrations already applied by migrate_run_production. Fly's
    # release_command will re-run `migration:run` as a no-op safety net.
    - |
      MAX_RETRIES=3
      RETRY_COUNT=0
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        echo "Deployment attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
        if flyctl deploy --remote-only --no-cache --config fly.production.toml; then
          echo "Deployment successful!"
          exit 0
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "Deployment failed, waiting 30 seconds before retry..."
            sleep 30
          else
            echo "All deployment attempts failed"
            exit 1
          fi
        fi
      done
  environment:
    name: production/backend
    url: https://vgreens-backend.fly.dev

deploy_frontend:
  stage: deploy
  only:
    - master
  before_script:
    - *flyctl_setup
  script:
    - cd frontend
    - echo "=== Starting Production Frontend Deployment ==="
    - test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" && echo "Clerk publishable key present" || (echo "ERROR - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY not set" && exit 1)
    - test -n "$CLERK_SECRET_KEY" && echo "Clerk secret key present" || (echo "ERROR - CLERK_SECRET_KEY not set" && exit 1)
    - test -n "$NEXT_PUBLIC_POSTHOG_KEY" && echo "PostHog key present" || (echo "ERROR - NEXT_PUBLIC_POSTHOG_KEY not set" && exit 1)
    - flyctl secrets set CLERK_SECRET_KEY="$CLERK_SECRET_KEY" --app vgreens-frontend
    - |
      MAX_RETRIES=3
      RETRY_COUNT=0
      BUILD_ARGS="--build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY --build-arg NEXT_PUBLIC_POSTHOG_KEY=$NEXT_PUBLIC_POSTHOG_KEY --build-arg NEXT_PUBLIC_POSTHOG_HOST=$NEXT_PUBLIC_POSTHOG_HOST"
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        echo "Deployment attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
        if flyctl deploy --remote-only --no-cache --config fly.production.toml $BUILD_ARGS; then
          echo "Deployment successful!"
          exit 0
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "Deployment failed, waiting 30 seconds before retry..."
            sleep 30
          else
            echo "All deployment attempts failed"
            exit 1
          fi
        fi
      done
  environment:
    name: production/frontend
    url: https://vgreens-frontend.fly.dev
  needs:
    - deploy_backend

deploy_status:
  stage: deploy
  only:
    - master
  before_script:
    - *flyctl_setup
  script:
    - cd gatus
    - echo "=== Starting Production Status Page Deployment ==="
    - |
      MAX_RETRIES=3
      RETRY_COUNT=0
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        echo "Deployment attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
        if flyctl deploy --remote-only --no-cache --config fly.production.toml; then
          echo "Deployment successful!"
          exit 0
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "Deployment failed, waiting 30 seconds before retry..."
            sleep 30
          else
            echo "All deployment attempts failed"
            exit 1
          fi
        fi
      done
  environment:
    name: production/status
    url: https://vgreens-status.fly.dev

# Manual production deployment (no migration gating — assumes caller has
# already applied migrations via migrate_run_production).
deploy_manual:
  stage: deploy
  when: manual
  before_script:
    - *flyctl_setup
  script:
    - echo "=== Deploying Backend (Production) ==="
    - cd backend && flyctl deploy --remote-only --no-cache --config fly.production.toml
    - echo "=== Deploying Frontend (Production) ==="
    - cd ../frontend
    - test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" && echo "Clerk publishable key present" || (echo "ERROR - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY not set" && exit 1)
    - test -n "$CLERK_SECRET_KEY" && echo "Clerk secret key present" || (echo "ERROR - CLERK_SECRET_KEY not set" && exit 1)
    - test -n "$NEXT_PUBLIC_POSTHOG_KEY" && echo "PostHog key present" || (echo "ERROR - NEXT_PUBLIC_POSTHOG_KEY not set" && exit 1)
    - flyctl secrets set CLERK_SECRET_KEY="$CLERK_SECRET_KEY" --app vgreens-frontend
    - flyctl deploy --remote-only --no-cache --config fly.production.toml --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" --build-arg NEXT_PUBLIC_POSTHOG_KEY="$NEXT_PUBLIC_POSTHOG_KEY" --build-arg NEXT_PUBLIC_POSTHOG_HOST="$NEXT_PUBLIC_POSTHOG_HOST"
    - echo "=== Deploying Status Page (Production) ==="
    - cd ../gatus && flyctl deploy --remote-only --no-cache --config fly.production.toml

# ──────────────────────────────────────
# Staging — triggered on staging branch
# ──────────────────────────────────────

deploy_backend_staging:
  stage: deploy
  only:
    - staging
  needs:
    - migrate_run_staging
  before_script:
    - *flyctl_setup
  script:
    - cd backend
    - echo "=== Starting Staging Backend Deployment ==="
    # Migrations already applied by migrate_run_staging. Fly's
    # release_command will re-run `migration:run` as a no-op safety net.
    - |
      MAX_RETRIES=3
      RETRY_COUNT=0
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        echo "Deployment attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
        if flyctl deploy --remote-only --no-cache --config fly.staging.toml; then
          echo "Deployment successful!"
          exit 0
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "Deployment failed, waiting 30 seconds before retry..."
            sleep 30
          else
            echo "All deployment attempts failed"
            exit 1
          fi
        fi
      done
  environment:
    name: staging/backend
    url: https://vgreens-backend-staging.fly.dev

deploy_frontend_staging:
  stage: deploy
  only:
    - staging
  before_script:
    - *flyctl_setup
  script:
    - cd frontend
    - echo "=== Starting Staging Frontend Deployment ==="
    - test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" && echo "Clerk publishable key present" || (echo "ERROR - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY not set" && exit 1)
    - test -n "$CLERK_SECRET_KEY" && echo "Clerk secret key present" || (echo "ERROR - CLERK_SECRET_KEY not set" && exit 1)
    - flyctl secrets set CLERK_SECRET_KEY="$CLERK_SECRET_KEY" --app vgreens-frontend-staging
    - |
      MAX_RETRIES=3
      RETRY_COUNT=0
      BUILD_ARGS="--build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        echo "Deployment attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
        if flyctl deploy --remote-only --no-cache --config fly.staging.toml $BUILD_ARGS; then
          echo "Deployment successful!"
          exit 0
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
            echo "Deployment failed, waiting 30 seconds before retry..."
            sleep 30
          else
            echo "All deployment attempts failed"
            exit 1
          fi
        fi
      done
  environment:
    name: staging/frontend
    url: https://vgreens-frontend-staging.fly.dev
  needs:
    - deploy_backend_staging

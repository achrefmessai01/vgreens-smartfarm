image: alpine:latest

stages:
  - deploy

variables:
  GIT_STRATEGY: fetch
  # Fly.io CLI version
  FLY_VERSION: '0.3.55'

.install_flyctl: &install_flyctl
  - apk add --no-cache curl
  - curl -L https://fly.io/install.sh | sh
  - export FLYCTL_INSTALL="/root/.fly"
  - export PATH="$FLYCTL_INSTALL/bin:$PATH"

# Deploy Backend to Fly.io
deploy_backend:
  stage: deploy
  only:
    - master
  before_script:
    - *install_flyctl
  script:
    - cd backend
    - flyctl deploy --remote-only --config fly.toml
  environment:
    name: production/backend
    url: https://vgreens-backend.fly.dev
  variables:
    FLY_API_TOKEN: $FLY_API_TOKEN

# Deploy Frontend to Fly.io
deploy_frontend:
  stage: deploy
  only:
    - master
  before_script:
    - *install_flyctl
  script:
    - cd frontend
    - flyctl deploy --remote-only --config fly.toml
  environment:
    name: production/frontend
    url: https://vgreens-frontend.fly.dev
  variables:
    FLY_API_TOKEN: $FLY_API_TOKEN
  needs:
    - deploy_backend

# Manual deployment job for staging/testing
deploy_manual:
  stage: deploy
  when: manual
  before_script:
    - *install_flyctl
  script:
    - echo "Select which app to deploy"
    - cd backend && flyctl deploy --remote-only --config fly.toml
    - cd ../frontend && flyctl deploy --remote-only --config fly.toml
  variables:
    FLY_API_TOKEN: $FLY_API_TOKEN
